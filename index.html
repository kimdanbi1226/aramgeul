ine-height:1.6;color:#596578}.rule-meta{margin-top:7px;font-size:11px;color:#718096}.rule-source{display:inline-block;margin-top:8px;font-size:12px;color:var(--primary);text-decoration:none;font-weight:700}.rule-source:hover{text-decoration:underline}.detail-meta{margin-top:8px;font-size:11px;color:#8994a4}.result-hint{margin-top:8px;color:#8994a4;font-size:12px;line-height:1.6}.technical-details{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:#fbfcfe}.technical-details summary{padding:11px 13px;cursor:pointer;color:#687386;font-size:12px;font-weight:700}.technical-details .technical-body{padding:0 12px 12px}.engine-status{margin-top:10px;padding:10px 12px;border:1px solid #dfe7f4;border-radius:10px;background:#f8faff;color:#596578;font-size:12px;line-height:1.5}.engine-status strong{color:#172033}.technical-details .engine-status:first-child{margin-top:0}.result-warning{margin-top:8px;color:#7a8595;font-size:12px;line-height:1.6}
.candidates{margin-top:14px;padding:14px;border:1px solid #f0dfb6;border-radius:14px;background:#fffaf0}.candidate{padding:8px 0}.candidate+.candidate{border-top:1px solid #f0e6cf}.candidate strong{font-size:12px;color:#7a5a16}.candidate div{margin-top:3px}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.info{padding:18px;border:1px solid var(--line);border-radius:16px;background:#fff}.info strong{display:block;margin-bottom:6px;font-size:14px}.info span{font-size:13px;color:var(--muted);line-height:1.6}
.notice{margin:20px 0 0;color:#8994a4;font-size:12px;line-height:1.7;text-align:center}footer{text-align:center;color:#929bab;font-size:12px;padding:0 24px 34px}
@media(max-width:700px){.header-inner{padding:15px 16px}.nav{gap:14px}.nav a{font-size:13px}main{padding:42px 16px 65px}.editor-actions{flex-wrap:wrap}.editor,.result{padding:18px}.editor-bottom{align-items:stretch;flex-direction:column}.check{width:100%}.info-grid{grid-template-columns:1fr}.arrow{display:none}.change-part{min-width:100%}}

<body>
<header><div class="header-inner"><a class="brand-link" href="/" aria-label="아람글 홈"><div class="mark"><img src="/aramgeul-logo.svg" alt="아람글 로고"></div><div><div class="brand-name">아람글</div><div class="brand-sub">한국어 맞춤법 · 띄어쓰기 · 표현 검사</div></div></a><nav class="nav" aria-label="주요 메뉴"><a href="#checker">맞춤법 검사</a><a href="#expression">표현 검색</a></nav></div></header>
<main id="checker">
<section class="hero"><div class="eyebrow">ARAMGEUL</div><h1>더 정확하게,<br>더 자연스럽게.</h1><p>한국어 문장을 입력하면 맞춤법·띄어쓰기·표현을 확인하고, 수정된 부분과 검사 설명을 함께 볼 수 있습니다.</p></section>
<section class="card">
<div class="editor"><textarea id="text" maxlength="5000" placeholder="검사할 문장을 입력해 주세요.
예: 오늘은 날씨가 좋아서 산책을 하러 갔어요."></textarea><div class="editor-bottom"><div class="editor-actions"><button class="tool-button" id="newText" type="button">＋ 새 글 작성</button><button class="tool-button" id="pasteText" type="button">전체 붙여넣기</button><button class="tool-button" id="copyText" type="button">전체 복사</button></div><span class="count"><span id="count">0</span> / 5,000자</span><button class="check" id="check" type="button">검사하기</button></div></div>
<div class="result" id="result"><div class="result-head"><div class="result-title">검사 결과</div><span class="status" id="status">확인 중</span></div><div class="result-actions"><button class="tool-button" id="resultNewText" type="button">＋ 새 글 작성</button><button class="tool-button" id="editResult" type="button">편집하기</button><button class="tool-button" id="copyResult" type="button">전체 복사</button></div><textarea class="edit-result" id="editResultText" aria-label="검사 결과 편집"></textarea><div class="result-after-actions"><button class="check" id="recheck" type="button">다시 검사</button></div><div id="resultContent"></div></div>
</section>

<p class="notice">검사 요청은 보안 서버를 거쳐 검사용 API로 전달됩니다. API 인증 정보는 이 화면의 코드에 노출하지 않습니다.</p>
</main><footer>© 아람글 · 한국어를 더 정확하고 자연스럽게</footer>
<script>
const text = document.getElementById('text');
const count = document.getElementById('count');
const result = document.getElementById('result');
const status = document.getElementById('status');
const resultContent = document.getElementById('resultContent');
const checkButton = document.getElementById('check');

text.addEventListener('input', () => {
  count.textContent = text.value.length.toLocaleString('ko-KR');
});

document.getElementById("newText").addEventListener("click",()=>{if(text.value.trim()&&!confirm("새 글을 작성할까요? 현재 작성한 내용이 사라집니다."))return;text.value="";count.textContent="0";result.classList.remove("show");resultContent.innerHTML="";text.focus()});
document.getElementById("copyText").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(text.value)}catch(e){alert("복사에 실패했습니다.")}});
document.getElementById("pasteText").addEventListener("click",async()=>{try{text.value=(await navigator.clipboard.readText()).slice(0,5000);text.dispatchEvent(new Event("input"));text.focus()}catch(e){alert("붙여넣기에 실패했습니다.")}});
document.getElementById("resultNewText").addEventListener("click",()=>{text.value="";count.textContent="0";result.classList.remove("show","editing");resultContent.innerHTML="";text.focus()});
document.getElementById("editResult").addEventListener("click",()=>{const box=result.querySelector(".revised-text");document.getElementById("editResultText").value=box?box.textContent:"";result.classList.add("editing");document.getElementById("editResultText").focus()});
document.getElementById("copyResult").addEventListener("click",async()=>{const box=result.querySelector(".revised-text");const value=result.classList.contains("editing")?document.getElementById("editResultText").value:(box?box.textContent:"");if(!value)return;try{await navigator.clipboard.writeText(value)}catch(e){alert("복사에 실패했습니다.")}});
document.getElementById("recheck").addEventListener("click",()=>{text.value=document.getElementById("editResultText").value;text.dispatchEvent(new Event("input"));result.classList.remove("editing");checkButton.click()});
checkButton.addEventListener('click', async () => {
  const value = text.value.trim();
  result.classList.add('show');

  if (!value) {
    setStatus('입력 필요', '');
    resultContent.innerHTML = '<div class="result-box">검사할 문장을 먼저 입력해 주세요.</div>';
    return;
  }

  checkButton.disabled = true;
  checkButton.textContent = '검사 중...';
  setStatus('검사 중', '');
  resultContent.innerHTML = '<div class="result-box">문장을 분석하고 있습니다...</div>';

  try {
    const response = await fetch('/api/check', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text: value})
    });

    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(data.error || 'API 요청 실패');
    }

    renderResult(data, value);
  } catch (error) {
    console.error(error);
    setStatus('검사 실패', '');
    resultContent.innerHTML = '<div class="result-box">검사에 실패했습니다.<br>잠시 후 다시 시도해 주세요.</div>';
  } finally {
    checkButton.disabled = false;
    checkButton.textContent = '검사하기';
  }
});

function renderResult(data, input) {
  const decision = data.decision || 'NO_DECISION';

  if (decision === 'CORRECTION') setStatus('교정 확인', 'correction');
  else if (decision === 'VALID') setStatus('오류 없음', 'valid');
  else if (decision === 'AMBIGUOUS') setStatus('추가 확인 필요', 'ambiguous');
  else setStatus('판정 보류', '');

  const revised = data.revised || input;
  const engines = data.engines || {};
  const engineNames = [];
  if (engines.aramgeul_rule) engineNames.push('아람글 규칙 엔진');
  if (engines.bareun) engineNames.push('Bareun');

  const engineStatus = engineNames.length
    ? '<div class="engine-status"><strong>검사 엔진</strong> · ' + escapeHtml(engineNames.join(' + ')) +
      (engines.bareun ? '' : ' · Bareun 미연결') + '</div>'
    : '<div class="engine-status"><strong>검사 엔진</strong> · 연결된 엔진이 없습니다.</div>';

  const dictionaryEvidence = data.dictionary_evidence || {};
  const dictionaryDecisions = Array.isArray(data.dictionary_decisions)
    ? data.dictionary_decisions
    : [];
  const dictionaryWarning = data.dictionary_warning
    ? '<div class="result-warning">' + escapeHtml(data.dictionary_warning) + '</div>'
    : '';
  const dictionaryStatus = dictionaryEvidence.enabled
    ? '<div class="engine-status"><strong>사전 증거 계층</strong> · 활성화 · ' +
      (dictionaryDecisions.length
        ? dictionaryDecisions.map(item =>
            escapeHtml(item.rule_id || '규칙') + ': ' + escapeHtml(item.status || '판정 없음')
          ).join(' · ')
        : '해당 규칙의 사전 판정 없음') +
      '</div>'
    : '';

  const htmlWarning = data.engine_warning
    ? '<div class="result-warning">' + escapeHtml(data.engine_warning) + '</div>'
    : '';

  let blocks = Array.isArray(data.revised_blocks)
    ? data.revised_blocks.filter(block =>
        block && typeof block.revised === 'string' &&
        typeof block.origin?.text === 'string' &&
        block.revised !== block.origin.text
      )
    : [];

  // 서버가 교정문(revised)과 rule_edits는 반환했지만 표시용 revised_blocks를
  // 만들지 못한 경우에도 프런트가 스스로 표시 블록을 복원한다.
  // 특히 Bareun 미연결 상태의 띄어쓰기 삭제처럼 최종 문장은 바뀌었지만
  // 서버 블록이 비어 있는 경우를 여기서 복구한다.
  if (!blocks.length) {
    // 최종 통합 교정(edit)이 실제로 존재하는데 서버 표시 블록이 비어 있으면
    // 통합 결과의 edit를 직접 사용해 표시 블록을 복원한다.
    // rule_edits는 규칙 엔진 원본, edits는 최종 통합 결과이므로
    // 둘 중 하나만 남아 있어도 UI가 교정 정보를 잃지 않도록 한다.
    const fallbackEdits = Array.isArray(data.rule_edits) && data.rule_edits.length
      ? data.rule_edits
      : (Array.isArray(data.edits) ? data.edits : []);

    if (fallbackEdits.length) {
      blocks = buildClientRuleFallbackBlocks(data.origin || input, revised, fallbackEdits);
    }
  }

  let html = '<div class="result-box">';
  html += '<div class="result-label">검사 결과</div>';
  html += '<div class="revised-text" id="revisedSentence">' + renderSentenceWithEdits(revised, blocks) + '</div>';
  html += '</div>';
  html += '<details class="technical-details"><summary>검사 정보 보기</summary><div class="technical-body">' +
    engineStatus +
    dictionaryStatus +
    htmlWarning +
    dictionaryWarning +
    '</div></details>';
  if (blocks.length) {
    html += '<div class="result-hint">수정된 부분을 누르면 변경 내용과 검사 설명을 확인할 수 있습니다.</div>';
    html += '<div class="result-section-title"><span>교정 내용</span><span id="correctionCount">' + blocks.length + '개</span></div>';
    html += '<div class="corrections">';

    html += blocks.map((block, index) => {
      const helpText = block.help || block.rule?.description || '';
      const help = helpText
        ? '<div class="help"><strong>왜?</strong> ' + escapeHtml(helpText) + '</div>'
        : '<div class="detail-empty">검사 엔진에서 별도 설명을 제공하지 않았습니다.</div>';

      const rule = block.rule
        ? '<div class="rule-evidence">' +
            '<div class="detail-title">아람글 규칙</div>' +
            '<div class="rule-title">' + escapeHtml(block.rule.title || '') + '</div>' +
            '<div class="rule-description">' + escapeHtml(block.rule.description || '') + '</div>' +
            '<div class="rule-meta">' +
              escapeHtml(block.rule.source_name || '') +
              (block.rule.source_reference ? ' · ' + escapeHtml(block.rule.source_reference) : '') +
              (block.rule.rule_id ? ' · ' + escapeHtml(block.rule.rule_id) : '') +
            '</div>' +
            (block.rule.source_url
              ? '<a class="rule-source" href="' + escapeHtml(block.rule.source_url) + '" target="_blank" rel="noopener noreferrer">어문 규범 원문 보기 ↗</a>'
              : '') +
            (block.rule.source_detail_url
              ? '<a class="rule-source secondary" href="' + escapeHtml(block.rule.source_detail_url) + '" target="_blank" rel="noopener noreferrer">' +
                escapeHtml(block.rule.source_detail_label || '관련 국립국어원 설명 보기') + ' ↗</a>'
              : '') +
          '</div>'
        : '';
      const diff = diffHtml(block.origin.text, block.revised);
      const editType = getEditType(block);
      const summaryText = helpText || (editType === '띄어쓰기'
        ? '단어 사이의 띄어쓰기를 바로잡았습니다.'
        : editType === '붙여쓰기'
          ? '불필요한 띄어쓰기를 붙여 썼습니다.'
          : '문맥과 규칙에 맞게 표현을 바로잡았습니다.');
      return '<div class="correction clickable" data-correction-index="' + index + '" tabindex="0" role="button" aria-expanded="false">' +
        '<div class="correction-top"><span class="correction-index">교정 ' + (index + 1) + '</span><span class="correction-type">' + escapeHtml(editType) + '</span></div>' +
        '<div class="change">' +
          '<div class="change-part"><div class="result-label">변경 전</div><div class="change-value">' + escapeHtml(block.origin.text) + '</div></div>' +
          '<div class="arrow">→</div>' +
          '<div class="change-part"><div class="result-label">변경 후</div><div class="change-value">' + escapeHtml(block.revised) + '</div></div>' +
        '</div>' +
        '<div class="correction-summary"><strong>한눈에 보기</strong> · ' + escapeHtml(summaryText) + '</div>' +
        '<div class="detail">' +
          '<div class="detail-title">문장 안에서 변경된 부분</div>' +
          '<div class="diff">' + diff + '</div>' +
          help +
          rule +
          '<div class="detail-meta">' +
          (block.source === 'aramgeul-rule'
            ? '검사 엔진: 아람글 규칙 엔진 · 형태소 분석과 등록된 규칙을 근거로 판단했습니다.'
            : '검사 엔진: Bareun · 아람글 규칙 근거가 확인된 경우 규칙과 공식 출처를 함께 표시합니다.') +
        '</div>' +
        '</div>' +
      '</div>';
    }).join('');
    html += '</div>';
  } else if (decision === 'VALID') {
    html += '<div class="result-box" style="margin-top:14px">현재 연결된 검사 범위에서는 수정할 항목을 찾지 못했습니다.</div>';
  }

  if (decision === 'AMBIGUOUS' && Array.isArray(data.candidates) && data.candidates.length) {
    html += '<div class="candidates"><strong>교정 후보를 하나로 확정하지 않았습니다.</strong>';
    html += data.candidates.map(candidate =>
      '<div class="candidate"><strong>' + escapeHtml(candidate.source || '검사 계층') + '</strong><div>' +
      escapeHtml(candidate.revised || '') + '</div></div>'
    ).join('');
    html += '</div>';
  }

  resultContent.innerHTML = html;
  bindCorrectionCards();
  bindSentenceEdits();
}

function buildClientRuleFallbackBlocks(source, revised, ruleEdits) {
  if (
    typeof source !== 'string' ||
    typeof revised !== 'string' ||
    !Array.isArray(ruleEdits)
  ) {
    return [];
  }

  const edits = ruleEdits
    .filter(edit =>
      edit &&
      Number.isInteger(edit.start) &&
      Number.isInteger(edit.end) &&
      edit.start >= 0 &&
      edit.end >= edit.start &&
      typeof edit.replacement === 'string' &&
      edit.rule
    )
    .sort((a, b) => a.start - b.start);

  return edits.map((edit, index) => {
    const contextStart = Math.max(
      0,
      source.lastIndexOf(' ', Math.max(0, edit.start - 1)) + 1
    );
    const nextSpace = source.indexOf(' ', edit.end);
    const contextEnd = nextSpace >= 0
      ? nextSpace
      : Math.min(source.length, edit.end + 8);

    const originText = source.slice(contextStart, contextEnd);
    const localStart = edit.start - contextStart;
    const localEnd = edit.end - contextStart;
    const revisedContext =
      originText.slice(0, localStart) +
      edit.replacement +
      originText.slice(localEnd);

    const revisedStart = Number.isInteger(edit.revised_start)
      ? edit.revised_start
      : edit.start + edits
          .filter(previous => previous.start < edit.start)
          .reduce(
            (sum, previous) =>
              sum + previous.replacement.length - (previous.end - previous.start),
            0
          );

    const revisedEnd = Number.isInteger(edit.revised_end)
      ? edit.revised_end
      : revisedStart + edit.replacement.length;

    return {
      id: 'client-rule-' + index + '-' + edit.rule.rule_id,
      origin: {
        text: originText,
        start: contextStart,
        end: contextEnd
      },
      revised: revisedContext,
      revised_start: revisedStart,
      revised_end: revisedEnd,
      rule: edit.rule,
      rules: [edit.rule],
      help: edit.rule.description || '',
      source: 'aramgeul-rule',
      rule_edit: {
        start: edit.start,
        end: edit.end,
        replacement: edit.replacement
      },
      rule_edits: [{
        start: edit.start,
        end: edit.end,
        replacement: edit.replacement
      }]
    };
  });
}

function getEditType(block) {
  const original = typeof block?.origin?.text === 'string' ? block.origin.text : '';
  const changed = typeof block?.revised === 'string' ? block.revised : '';

  if (original && changed && original.replace(/\s/g, '') === changed.replace(/\s/g, '')) {
    const originalSpaces = (original.match(/\s/g) || []).length;
    const revisedSpaces = (changed.match(/\s/g) || []).length;
    if (revisedSpaces > originalSpaces) return '띄어쓰기';
    if (revisedSpaces < originalSpaces) return '붙여쓰기';
  }

  const category = block?.rule?.category || '';
  if (category === 'orthography') return '맞춤법';
  if (category === 'spacing') return '띄어쓰기';
  if (category === 'expression') return '표현';
  return '교정';
}

function renderSentenceWithEdits(revised, blocks) {
  if (!blocks.length) return escapeHtml(revised);

  const ranges = [];
  let cursor = 0;

  blocks.forEach((block, index) => {
    const originalText = typeof block.origin?.text === 'string' ? block.origin.text : '';
    const revisedBlockText = typeof block.revised === 'string' ? block.revised : '';

    // 하나의 rule block 안에 같은 유형의 띄어쓰기 교정이 여러 개 있을 수 있다.
    // 예: '12억3456만7898' -> '12억 3456만 7898'은 같은 규칙으로
    // 띄어쓰기 위치가 2곳 생긴다. 모든 위치를 개별 부호로 표시한다.
    if (originalText && revisedBlockText && originalText.replace(/\s/g, '') === revisedBlockText.replace(/\s/g, '')) {
      const originalSpaces = (originalText.match(/\s/g) || []).length;
      const revisedSpaces = (revisedBlockText.match(/\s/g) || []).length;
      const blockStart = revised.indexOf(revisedBlockText, cursor);

      if (blockStart !== -1 && originalSpaces !== revisedSpaces) {
        let oi = 0;
        let ri = 0;

        while (oi < originalText.length || ri < revisedBlockText.length) {
          if (originalText[oi] === revisedBlockText[ri]) {
            oi++;
            ri++;
            continue;
          }

          if (revisedSpaces > originalSpaces && revisedBlockText[ri] === ' ') {
            ranges.push({
              start: blockStart + ri,
              end: blockStart + ri,
              index,
              kind: 'space-insert'
            });
            ri++;
            continue;
          }

          if (revisedSpaces < originalSpaces && originalText[oi] === ' ') {
            ranges.push({
              start: blockStart + ri,
              end: blockStart + ri,
              index,
              kind: 'space-delete'
            });
            oi++;
            continue;
          }

          // 공백 외 차이가 섞인 예외적인 블록은 일반 교정 경로로 넘긴다.
          break;
        }

        cursor = blockStart + revisedBlockText.length;
        return;
      }
    }

    const explicitStart = Number.isInteger(block.revised_start) ? block.revised_start : null;
    const explicitEnd = Number.isInteger(block.revised_end) ? block.revised_end : null;

    if (
      explicitStart !== null &&
      explicitEnd !== null &&
      explicitStart >= 0 &&
      explicitEnd >= explicitStart &&
      explicitEnd <= revised.length
    ) {
      const explicitText = revised.slice(explicitStart, explicitEnd);
      const originTextForDiff = originalText;
      const revisedTextForDiff = revisedBlockText || explicitText;

      const commonPrefixLimit = Math.min(originTextForDiff.length, revisedTextForDiff.length);
      let commonPrefix = 0;

      while (
        commonPrefix < commonPrefixLimit &&
        originTextForDiff[commonPrefix] === revisedTextForDiff[commonPrefix]
      ) {
        commonPrefix++;
      }

      let commonSuffix = 0;
      while (
        commonSuffix < originTextForDiff.length - commonPrefix &&
        commonSuffix < revisedTextForDiff.length - commonPrefix &&
        originTextForDiff[originTextForDiff.length - 1 - commonSuffix] ===
          revisedTextForDiff[revisedTextForDiff.length - 1 - commonSuffix]
      ) {
        commonSuffix++;
      }

      const changedStart = explicitStart + commonPrefix;
      const changedEnd = explicitEnd - commonSuffix;

      if (explicitText.trim() && changedEnd > changedStart) {
        ranges.push({
          start: changedStart,
          end: changedEnd,
          index,
          kind: 'text'
        });
        cursor = Math.max(cursor, changedEnd);
        return;
      }
    }

    const value = revisedBlockText.trim();
    if (value) {
      const foundStart = revised.indexOf(value, cursor);
      if (foundStart !== -1) {
        ranges.push({
          start: foundStart,
          end: foundStart + value.length,
          index,
          kind: 'text'
        });
        cursor = foundStart + value.length;
      }
    }
  });

  ranges.sort((a, b) => a.start - b.start || a.end - b.end);

  if (!ranges.length) return escapeHtml(revised);

  let html = '';
  let position = 0;

  ranges.forEach(range => {
    if (range.start < position) return;

    html += escapeHtml(revised.slice(position, range.start));

    if (range.kind === 'space-insert') {
      html += '<span class="sentence-edit space-mark space-insert" data-correction-index="' +
        range.index +
        '" tabindex="0" role="button" aria-label="띄어쓰기 추가: 여기에 띄어쓰기를 해야 합니다;"> </span>';
      // 실제 공백은 그대로 유지하고, 부호만 공백 위에 겹쳐 표시한다.
      position = Math.min(range.start + 1, revised.length);
      return;
    }

    if (range.kind === 'space-delete') {
      html += '<span class="sentence-edit space-mark space-delete" data-correction-index="' +
        range.index +
        '" tabindex="0" role="button" aria-label="붙여쓰기: 이 위치의 띄어쓰기를 없애야 합니다.">⌒</span>';
      position = range.start;
      return;
    }

    const highlighted = revised.slice(range.start, range.end);
    const editType = getEditType(blocks[range.index]);
    const label = highlighted.trim() ? highlighted : editType + ' 수정';

    html += '<span class="sentence-edit" data-correction-index="' + range.index +
      '" tabindex="0" role="button" aria-label="' + escapeHtml(editType + ': ' + label) + '">' +
      escapeHtml(highlighted) +
      '</span>';

    position = range.end;
  });

  html += escapeHtml(revised.slice(position));
  return html;
}

function bindSentenceEdits() {
  document.querySelectorAll('.sentence-edit').forEach(edit => {
    const activate = () => {
      const index = Number(edit.dataset.correctionIndex);
      selectCorrection(index, true);
    };

    edit.addEventListener('click', activate);
    edit.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        activate();
      }
    });
  });
}

function selectCorrection(index, scrollToCard = false) {
  document.querySelectorAll('.correction.clickable').forEach(card => {
    const selected = Number(card.dataset.correctionIndex) === index;
    card.classList.toggle('selected', selected);
    card.setAttribute('aria-expanded', selected ? 'true' : 'false');
  });

  document.querySelectorAll('.sentence-edit').forEach(edit => {
    edit.classList.toggle(
      'selected',
      Number(edit.dataset.correctionIndex) === index
    );
  });

  const card = document.querySelector('.correction[data-correction-index="' + index + '"]');

  if (card && scrollToCard) {
    card.scrollIntoView({behavior: 'smooth', block: 'nearest'});
  }
}

function bindCorrectionCards() {
  document.querySelectorAll('.correction.clickable').forEach(card => {
    const toggle = () => {
      const index = Number(card.dataset.correctionIndex);
      const wasSelected = card.classList.contains('selected');

      if (wasSelected) {
        card.classList.remove('selected');
        card.setAttribute('aria-expanded', 'false');
        document.querySelectorAll('.sentence-edit').forEach(edit => {
          if (Number(edit.dataset.correctionIndex) === index) {
            edit.classList.remove('selected');
          }
        });
        return;
      }

      selectCorrection(index, false);
    };

    card.addEventListener('click', event => {
      if (event.target.closest('a')) return;
      toggle();
    });
    card.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        toggle();
      }
    });
  });
}

function diffHtml(original, revised) {
  if (original === revised) return escapeHtml(revised);

  const a = Array.from(original);
  const b = Array.from(revised);
  const rows = a.length + 1;
  const cols = b.length + 1;
  const dp = Array.from({length: rows}, () => new Array(cols).fill(0));

  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = b.length - 1; j >= 0; j--) {
      dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    }
  }

  const parts = [];
  let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) {
      parts.push({type: 'same', text: a[i]});
      i++; j++;
    } else if (dp[i + 1][j] >= dp[i][j + 1]) {
      parts.push({type: 'removed', text: a[i++]});
    } else {
      parts.push({type: 'added', text: b[j++]});
    }
  }
  while (i < a.length) parts.push({type: 'removed', text: a[i++]});
  while (j < b.length) parts.push({type: 'added', text: b[j++]});

  return parts.map(part => {
    const value = escapeHtml(part.text);
    if (part.type === 'removed') return '<span class="diff-removed">' + value + '</span>';
    if (part.type === 'added') return '<span class="diff-added">' + value + '</span>';
    return value;
  }).join('');
}

function setStatus(label, className) {
  status.textContent = label;
  status.className = 'status' + (className ? ' ' + className : '');
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}
