<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아람글 | 한국어 지식·표현 서비스</title>
<meta name="description" content="정확한 한국어를 이해하고 바르게 쓰도록 돕는 한국어 지식·표현 서비스, 아람글">
<style>
:root{--navy:#173b68;--sky:#eaf4ff;--ink:#20252b;--muted:#697586;--line:#dfe6ee;--bg:#f7faff}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);background:linear-gradient(180deg,#eef6ff 0%,var(--bg) 42%,#fff 100%)}
header{max-width:1120px;margin:auto;padding:28px 24px 18px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--navy);color:#fff;font-weight:800;font-size:20px}
.brand-name{font-size:25px;font-weight:800;letter-spacing:-.04em}
.tag{color:var(--muted);font-size:13px}
main{max-width:1120px;margin:auto;padding:58px 24px 90px}
.hero{text-align:center;margin-bottom:34px}
.hero h1{margin:0 0 14px;font-size:clamp(34px,5vw,54px);letter-spacing:-.055em;line-height:1.15}
.hero p{margin:0;color:var(--muted);font-size:17px;line-height:1.7}
.card{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 50px rgba(31,58,91,.09);overflow:hidden}
.toolbar{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;gap:9px;flex-wrap:wrap}
.mode{border:1px solid #cdd8e5;background:#fff;color:#425466;border-radius:999px;padding:9px 14px;font-size:14px;cursor:pointer}
.mode.active{background:var(--sky);border-color:#b9d8f7;color:var(--navy);font-weight:700}
.editor{padding:24px}
textarea{width:100%;min-height:250px;resize:vertical;border:1px solid #cfd9e5;border-radius:16px;padding:20px;font:inherit;font-size:18px;line-height:1.8;color:var(--ink);outline:none;background:#fbfdff}
textarea:focus{border-color:#78a9d9;box-shadow:0 0 0 4px rgba(47,111,186,.10)}
.bottom{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:14px}
.count{color:var(--muted);font-size:13px}
button.check{border:0;border-radius:12px;padding:13px 22px;background:var(--navy);color:#fff;font:inherit;font-weight:700;cursor:pointer}
button.check:hover{background:#102f54}
.result{display:none;border-top:1px solid var(--line);padding:24px;background:#fbfdff}
.result.show{display:block}
.result-title{font-size:18px;font-weight:800;margin-bottom:14px}
.result-box{padding:18px;border:1px solid var(--line);border-radius:14px;background:#fff;line-height:1.85}
.notice{margin-top:28px;color:var(--muted);font-size:13px;line-height:1.7;text-align:center}
footer{text-align:center;color:#8994a3;font-size:12px;padding:0 24px 35px}
@media(max-width:640px){main{padding:38px 16px 65px}.editor,.result{padding:18px}.bottom{align-items:stretch;flex-direction:column}button.check{width:100%}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="mark">글</div>
    <div><div class="brand-name">아람글</div><div class="tag">한국어 지식 · 표현 서비스</div></div>
  </div>
</header>
<main>
  <section class="hero">
    <h1>더 정확하게, 더 자연스럽게</h1>
    <p>한국어 문장을 입력하면 맞춤법·띄어쓰기·표현을 확인할 수 있어요.</p>
  </section>
  <section class="card">
    <div class="toolbar">
      <button class="mode active" type="button">맞춤법</button>
      <button class="mode" type="button">띄어쓰기</button>
      <button class="mode" type="button">표현</button>
    </div>
    <div class="editor">
      <textarea id="text" maxlength="5000" placeholder="검사할 문장을 입력해 주세요."></textarea>
      <div class="bottom">
        <span class="count"><span id="count">0</span> / 5,000자</span>
        <button class="check" id="check" type="button">검사하기</button>
      </div>
    </div>
    <div class="result" id="result">
      <div class="result-title">검사 결과</div>
      <div class="result-box" id="resultBox"></div>
    </div>
  </section>
  <p class="notice">현재는 아람글의 기본 화면을 구현한 단계입니다. 실제 맞춤법·띄어쓰기 검사 엔진은 다음 단계에서 연결합니다.</p>
</main>
<footer>© 아람글. 한국어를 더 정확하고 자연스럽게.</footer>
<script>
const text=document.getElementById('text');
const count=document.getElementById('count');
const result=document.getElementById('result');
const resultBox=document.getElementById('resultBox');
text.addEventListener('input',()=>count.textContent=text.value.length.toLocaleString('ko-KR'));
document.querySelectorAll('.mode').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.mode').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}));
document.getElementById('check').addEventListener('click',()=>{
  const value=text.value.trim();
  result.classList.add('show');
  if(!value){resultBox.textContent='검사할 문장을 먼저 입력해 주세요.';return;}
  resultBox.innerHTML='<span style="color:#16794c;font-weight:700;">입력 완료</span><br>실제 맞춤법·띄어쓰기 검사 기능은 검사 엔진을 연결한 뒤 이곳에 결과가 표시됩니다.';
});
</script>
</body>
</html>
