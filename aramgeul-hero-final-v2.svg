<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 728" role="img" aria-labelledby="title desc">
<title id="title">아람글 맞춤법·띄어쓰기·표현 서비스 소개</title>
<desc id="desc">한국어의 맞춤법과 표현을 정확하게 확인하는 아람글의 브랜드 Hero 그래픽</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdfa"/><stop offset=".52" stop-color="#f5f8fc"/><stop offset="1" stop-color="#e9f2fc"/></linearGradient>
  <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#eef5fc"/><stop offset=".55" stop-color="#dceafb"/><stop offset="1" stop-color="#edf5fc"/></linearGradient>
  <linearGradient id="navyBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#315f9e"/><stop offset=".65" stop-color="#234a84"/><stop offset="1" stop-color="#182544"/></linearGradient>
  <linearGradient id="blueSoft" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9e9fb"/><stop offset="1" stop-color="#91b9e8"/></linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc36f"/><stop offset="1" stop-color="#ed8a28"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="15" stdDeviation="18" flood-color="#182544" flood-opacity=".12"/></filter>
  <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#182544" flood-opacity=".14"/></filter>
  <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
</defs>
<rect width="2048" height="728" fill="url(#bg)"/>
