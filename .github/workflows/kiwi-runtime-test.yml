name: Kiwi Runtime Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/morphology/kiwi-runtime.js'
      - 'lib/morphology/kiwi.js'
      - 'tests/kiwi-runtime.test.js'
      - 'tests/kiwi-adapter.test.js'
      - 'tests/kiwi-real-runtime.test.js'
      - 'package.json'
      - '.github/workflows/kiwi-runtime-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Kiwi runtime configuration test
        run: node tests/kiwi-runtime.test.js

      - name: Run Kiwi adapter fixture test
        run: node tests/kiwi-adapter.test.js

      - name: Download and install kiwi-nlp
        run: |
          npm pack kiwi-nlp@0.23.0 --silent
          npm install ./kiwi-nlp-0.23.0.tgz --no-save --no-audit --no-fund

      - name: Download official Kiwi v0.23.0 base model
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            -o kiwi_model_v0.23.0_base.tgz \
            https://github.com/bab2min/Kiwi/releases/download/v0.23.0/kiwi_model_v0.23.0_base.tgz
          mkdir -p runtime-assets
          tar -xzf kiwi_model_v0.23.0_base.tgz -C runtime-assets

      - name: Prepare WASM and model files
        run: |
          mkdir -p runtime-assets/wasm
          cp node_modules/kiwi-nlp/dist/kiwi-wasm.wasm runtime-assets/wasm/kiwi-wasm.wasm
          echo "=== WASM ==="
          ls -lh runtime-assets/wasm/kiwi-wasm.wasm
          echo "=== CoNg model files ==="
          find runtime-assets/models/cong/base -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Start local asset server
        run: |
          python3 -m http.server 8765 --directory runtime-assets >/tmp/kiwi-http.log 2>&1 &
          sleep 2
          curl -f http://127.0.0.1:8765/wasm/kiwi-wasm.wasm -o /dev/null

      - name: Run real Kiwi runtime test
        env:
          KIWI_MODEL_DIR: ${{ github.workspace }}/runtime-assets/models/cong/base
          KIWI_WASM_URL: http://127.0.0.1:8765/wasm/kiwi-wasm.wasm
        run: node tests/kiwi-real-runtime.test.js
