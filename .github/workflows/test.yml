name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run test suite
        shell: bash
        run: |
          set +e
          tests=(
            test:morphology
            test:rules
            test:check
            test:integration
            test:kiwi-runtime
            test:kiwi-real-runtime
            test:rule-blocks
            test:engine-contract
            test:spacing-golden
            test:dictionary
            test:dictionary-resilience
            test:dictionary-evidence
            test:dictionary-decision
            test:dictionary-flow
            test:expression-search
          )
          failed=0
          for test_name in "${tests[@]}"; do
            echo "===== npm run $test_name ====="
            npm run "$test_name"
            status=$?
            if [ $status -ne 0 ]; then
              failed=1
              echo "::error::$test_name failed with exit code $status"
            fi
          done
          exit $failed
