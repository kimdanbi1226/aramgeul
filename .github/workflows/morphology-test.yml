name: Morphology Golden Test

on:
  push:
    paths:
      - 'lib/morphology/**'
      - 'tests/golden/morphology.v0.1.json'
      - 'tests/run-mecab-ko-docker-golden.js'
      - '.github/workflows/morphology-test.yml'
  workflow_dispatch:

jobs:
  morphology:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull MeCab-Ko image
        run: docker pull ghcr.io/hephaex/mecab-ko:latest

      - name: Run Golden Test
        run: node tests/run-mecab-ko-docker-golden.js
