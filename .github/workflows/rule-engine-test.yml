name: Rule Engine Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/rules/**'
      - 'lib/pipeline/integrate.js'
      - 'lib/pipeline/rule-blocks.js'
      - 'api/check.js'
      - 'lib/morphology/mecab-ko.js'
      - 'tests/api-runtime.test.js'
      - 'tests/rule-engine-spacing.test.js'
      - 'tests/rule-engine-contract.test.js'
      - 'tests/result-integration.test.js'
      - 'tests/rule-correction-blocks.test.js'
      - 'package.json'
      - '.github/workflows/rule-engine-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run rule engine tests
        run: node tests/rule-engine-spacing.test.js
      - name: Run rule engine contract tests
        run: node tests/rule-engine-contract.test.js
      - name: Run result integration tests
        run: node tests/result-integration.test.js
      - name: Run rule correction block tests
        run: node tests/rule-correction-blocks.test.js
      - name: Run API production path test
        run: node tests/api-runtime.test.js
