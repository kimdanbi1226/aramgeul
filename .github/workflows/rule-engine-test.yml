name: Rule Engine Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/rules/**'
      - 'lib/pipeline/integrate.js'
      - 'tests/rule-engine-spacing.test.js'
      - 'tests/result-integration.test.js'
      - 'package.json'
      - '.github/workflows/rule-engine-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run rule engine tests
        run: node tests/rule-engine-spacing.test.js
      - name: Run result integration tests
        run: node tests/result-integration.test.js
