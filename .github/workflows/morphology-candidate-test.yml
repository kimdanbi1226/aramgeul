name: Morphology Candidate Comparison

on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/golden/morphology.v0.2.json'
      - 'tests/run-morphology-v02.py'
      - '.github/workflows/morphology-candidate-test.yml'

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install analyzers
        run: |
          python -m pip install --upgrade pip
          python -m pip install kiwipiepy PyKomoran
          npm install

      - name: Verify Kiwi adapter
        run: node tests/kiwi-adapter.test.js

      - name: Verify kiwi-nlp exports
        run: node --input-type=module -e "import('kiwi-nlp').then(m => { if (!m.KiwiBuilder || !m.Kiwi) throw new Error('Kiwi JS/WASM exports are missing'); console.log('kiwi-nlp exports: PASS'); })"

      - name: Pull MeCab-Ko image
        run: docker pull ghcr.io/hephaex/mecab-ko:latest

      - name: Run context-aware 24-case Golden Test
        run: python tests/run-morphology-v02.py
